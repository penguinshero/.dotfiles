# window & appearance

background_opacity         0.94
hide_window_decorations    yes

cursor_shape               beam
cursor_blink_interval      0

remember_window_size       no
initial_window_width       110c
initial_window_height      26c
enabled_layouts            splits

active_border_color        #5FAFAF
inactive_border_color      #2A2A2A

tab_bar_style              powerline
tab_powerline_style        slanted
tab_bar_min_tabs           1
tab_title_template         {index}: {title}

# active tab — cyan bg, dark fg
active_tab_foreground      #111111
active_tab_background      #5FAFAF
active_tab_font_style      bold

# inactive tab — subtle grey
inactive_tab_foreground    #D0D0D0
inactive_tab_background    #2A2A2A
inactive_tab_font_style    normal

# tab bar background
tab_bar_background         #111111

repaint_delay              10
input_delay                3
sync_to_monitor            yes

scrollback_lines           1000

copy_on_select             yes
strip_trailing_spaces      smart

enable_audio_bell          no
visual_bell_duration       0

detect_urls                yes
clipboard_control          write-clipboard write-primary

shell_integration          enabled
confirm_os_window_close    0
